name: CI

# Runs after the home lab's Jenkins build passes and reports the
# continuous-integration/jenkins/branch commit status. A status event runs
# this file from the default branch, so each job checks out the commit the
# status is for.
on:
  status

jobs:
  test:
    if: github.event.context == 'continuous-integration/jenkins/branch' && github.event.state == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [prove6, behave]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha }}
      - uses: Raku/setup-raku@v1
        with:
          raku-version: 'latest'
      - name: Raku version
        run: raku --version
      - name: Install git-only dependencies
        run: |
          zef install --/test --force-install https://github.com/gdonald/Template-HAML.git
          zef install --/test --force-install https://github.com/gdonald/BDD-Behave.git
          zef install --/test --force-install https://github.com/gdonald/ORM-ActiveRecord.git
          zef install --/test --force-install https://github.com/gdonald/ORM-Factory.git
      - name: Install Dependencies
        run: zef install --/test --test-depends --deps-only .
      - name: Install App::Prove6
        run: zef install --/test App::Prove6
      - name: Install DBIish
        run: zef install --/test DBIish
      - name: Run ${{ matrix.stage }}
        run: ./test.raku ${{ matrix.stage }}
